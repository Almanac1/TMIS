{% if show_search %}
<div class="search-card crm-search-panel card shadow-sm">
  <div class="card-body">
    <form method="get" class="js-list-search-form" data-clear-url="{{ search_clear_url|default:request.path }}">
      <label for="list-search-input" class="search-label form-label">{{ search_label|default:"Search" }}</label>
      <div class="search-row">
        <input
          id="list-search-input"
          type="text"
          name="q"
          class="form-control search-input"
          value="{{ search_query }}"
          placeholder="{{ search_placeholder|default:'Search records' }}"
        >
        <button type="submit" class="btn btn-primary search-btn">Search</button>
        <a class="clear-link" href="{{ search_clear_url|default:request.path }}">Clear filters</a>
      </div>
    </form>
  </div>
</div>
{% endif %}
