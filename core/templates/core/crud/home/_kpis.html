<section class="dashboard-kpi-grid" aria-label="CRM summary">
  <article class="dashboard-kpi-card">
    <span class="dashboard-kpi-icon"><i class="bi bi-people-fill"></i></span>
    <div><strong>{{ dashboard.kpis.total_prospects }}</strong><span>Prospects</span></div>
  </article>
  <article class="dashboard-kpi-card">
    <span class="dashboard-kpi-icon"><i class="bi bi-mortarboard-fill"></i></span>
    <div><strong>{{ dashboard.kpis.active_students }}</strong><span>Active Students</span></div>
  </article>
  <article class="dashboard-kpi-card">
    <span class="dashboard-kpi-icon"><i class="bi bi-chat-left-dots-fill"></i></span>
    <div><strong>{{ dashboard.kpis.open_inquiries }}</strong><span>Open Inquiries</span></div>
  </article>
  <article class="dashboard-kpi-card">
    <span class="dashboard-kpi-icon"><i class="bi bi-graph-up-arrow"></i></span>
    <div><strong>{{ dashboard.kpis.conversion_percent }}%</strong><span>Conversion Rate</span></div>
  </article>
</section>
